<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <title>STM32F476</title>
    <style>
        body {
            background-color: white;
            text-align: center;
            font-family: Calibri, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-weight: bold;
            margin-bottom: 30px;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .image-container {
            text-align: center;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .image-container p {
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>SPACE PROGRAM</h1>
    
    <div class="image-grid">
        <div class="image-container">
            <img src="img/nasarocket.jpg" alt="Rocket 1">
            <p>Rocket 1</p>
        </div>
        <div class="image-container">
            <img src="img/rockfactory.jpg" alt="Rocket 2">
            <p>Rocket 2</p>
        </div>
        <div class="image-container">
            <img src="img/gracelaunch.jpg" alt="Rocket 3">
            <p>Rocket 3</p>
        </div>
        <div class="image-container">
            <img src="img/landingrocket.jpeg" alt="Rocket 4">
            <p>Rocket 4</p>
        </div>
    </div>
</body>
</html>
