<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>STM32F746</title>
  <style>
    body { 
      color: black; 
      background-color: white; 
      margin: 0;                   /* Remove default body margin */
      font-family: Arial;          /* Consistent font */
    }
    table {
      width: 100%;
      border-collapse: collapse;   /* Remove spacing between cells */
    }
    td {
      vertical-align: top;         /* Align content to the top */
      padding: 0;                  /* Remove default cell padding */
    }
    .image-cell {
      width: 150px;                /* Match image width */
      padding-right: 10px;         /* Gap between image and text */
      padding-left: 10px;          /* Left gap (adjust as needed) */
      padding-top: 5px;           /* Top gap (adjust as needed) */
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td class="image-cell">
        <img style="width: 150px; height: 115px;" alt="Sad cat" src="img/sadcat.jpeg">
      </td>
      <td>
        <h1 style="font-style: italic; margin: 0;">Benedito's Webserver</h1>
        <h2>404 - Page not found</h2>
        <p style="font-family: 'Times New Roman', serif; margin-top: 5px;">
          Oops, the page you are requesting was not found on this server.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
